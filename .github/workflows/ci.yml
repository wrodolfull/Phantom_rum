name: Phantom Run CI
on:
  push:
    branches: [main, feat/phantom-run-mvp]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save browser traces when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phantom-chase-browser-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
